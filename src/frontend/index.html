<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ для решения БТ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at center, #2a2a2a 0%, #1a1a1a 70%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .root {
      display: flex;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 24px);
      width: calc(100vw - 24px);
      align-items: stretch;
    }

    .container {
      border-radius: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.25),
        0 0 20px rgba(255, 255, 255, 0.08),
        0 0 40px rgba(255, 255, 255, 0.05);
    }

    .container::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      pointer-events: none;
      opacity: 0.4;
      mix-blend-mode: screen;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    }

    .menu {
      color: white;
      flex: 0 0 220px;
    }

    .preview {
      display: none;
      flex: 0 0 520px;
    }

    .work-with-ai {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .container-title {
      font-size: 20px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 10px;
    }

    .start-message {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgb(186, 186, 186);
      font-weight: 500;
      font-size: 35px;
      text-align: center;
    }

    .input-area {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 12px;
      border-radius: 0 0 20px 20px;
    }

    .message-input {
      flex: 1;
      padding: 15.4px 18px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      font-size: 16px;
      color: white;
      outline: none;
      transition: all 0.2s ease;
    }

    .message-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .message-input:focus {
      border-color: rgba(255, 255, 255, 0.5);
    }

    .send-button,
    .file-button {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .send-button:hover,
    .file-button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .send-button::before {
      content: "➤";
      font-size: 28px;
      color: rgba(255, 255, 255, 0.9);
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.45;
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.3s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .user-message {
      align-self: flex-end;
      color: #fff;
      border-bottom-right-radius: 8px;
    }

    .ai-message {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.95);
      border-bottom-left-radius: 8px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .header {
      display: none;
      color: rgb(186, 186, 186);
    }

    @media(max-width:1250px) {
      .root {
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        height: calc(100vh - 16px);
        width: calc(100vw - 16px);
      }

      .menu,
      .preview {
        flex: none;
        height: 120px;
        display: none;
      }

      .work-with-ai {
        flex: 1;
        height: auto;
        min-height: 0;
      }

      .container {
        padding: 12px;
        border-radius: 20px;
      }

      .container-title {
        font-size: 14px;
        margin-bottom: 8px;
      }

      .menu .chat-messages,
      .preview .chat-messages {
        display: none;
      }

      .message-input {
        padding: 12px 16px;
        font-size: 16px;
      }

      .send-button,
      .file-button {
        width: 48px;
        height: 48px;
      }

      .send-button::before {
        font-size: 24px;
      }

      .header {
        display: -webkit-box;
        gap: 12px;
        padding: 10px 16px;
      }

      .menu-icon {
        font-size: 35px;
        cursor: pointer;
        margin-top: -6px;
      }

      .header-title {
        position: relative;
        font-size: 20px;
        font-weight: 600;
        margin-top: 8px;
        margin-left: 16px;
      }

      .header-title::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 37%;
        transform: translateY(-50%);
        width: 2px;
        height: 60%;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }
    }

    @media(max-width:480px) {
      .root {
        padding: 4px;
        height: calc(100vh - 8px);
        width: calc(100vw - 8px);
        gap: 6px;
      }

      .menu,
      .preview {
        height: 100px;
      }

      .container {
        padding: 10px;
        border-radius: 16px;
      }

      .container-title {
        font-size: 13px;
      }

      .input-area {
        gap: 8px;
      }

      .message-input {
        padding: 12px 14px;
      }

      .message {
        max-width: 90%;
        font-size: 14px;
        padding: 10px 14px;
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 90;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    @media(max-width:1250px) {
      .menu {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 85%;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 100;
        display: flex !important;
      }

      .menu.active {
        transform: translateX(0);
      }
    }

    @-moz-document url-prefix() {
      .root {
        height: 100vh;
      }

      .header-title {
        margin-left: 4px;
        margin-top: 7px;
      }

      .header-title::before {
        height: 19px;
        top: 12px;
      }

      .container::before {
        content: none;
      }
    }

    .new-chat-button {
      margin-top: 6px;
      padding: 6.5px;
      width: 100%;
      height: 32px;
      text-align: left;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .new-chat-button:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .new-chat-button:last-of-type {
      margin-bottom: 6px;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100% - 80px);
      overflow-y: auto;
    }

    .chat-item {
      border-radius: 4px;
      padding: 6.5px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chat-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

<body>
  <div class="root">
    <div class="container header">
      <div class="menu-icon">☰</div>
      <div class="header-title">MistralProto</div>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="menu container">
      <div class="container-title">MistralProto</div>

      <p>Чаты</p>
      <button class="new-chat-button">✅ Создать новый чат</button>
      <button id="exitChatButton" class="new-chat-button">🚪 Выйти из чата</button>
      <div class="chat-list"></div>
    </div>

    <div class="work-with-ai container">
      <div class="chat-messages" id="chatMessages">
        <p class="start-message">Привет! Что будем делать<br>сегодня? Создай новый чат!</p>
      </div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="Напиши сообщение..." class="message-input" autocomplete="off">
        <button class="file-button" aria-label="Выбрать файл">
          <img src="./icons/file.png" height="24px">
        </button>
        <button id="sendButton" class="send-button" aria-label="Отправить"></button>
      </div>
    </div>

    <div class="preview container">
      <div class="container-title">Предпросмотр</div>
    </div>
  </div>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const menu = document.querySelector(".menu");
  const overlay = document.getElementById("overlay");
  const menuIcon = document.querySelector(".menu-icon");
  const chatMessages = document.getElementById("chatMessages");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const newChatButton = document.querySelector(".new-chat-button");
  const chatList = document.querySelector(".chat-list");

  let chats = JSON.parse(localStorage.getItem("chats")) || [];
  let activeChatId = localStorage.getItem("activeChatId");

  function saveChats() {
    localStorage.setItem("chats", JSON.stringify(chats));
    localStorage.setItem("activeChatId", activeChatId);
  }

  function showMenu() {
    menu.classList.add("active");
    overlay.classList.add("active");
  }

  function hideMenu() {
    menu.classList.remove("active");
    overlay.classList.remove("active");
  }

  if (menuIcon) menuIcon.addEventListener("click", showMenu);
  if (overlay) overlay.addEventListener("click", hideMenu);

  function addMessage(text, isUser = false) {
    if (!activeChatId) return;
    const msg = { text, isUser, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
    const chat = chats.find(c => c.id === activeChatId);
    chat.messages.push(msg);
    saveChats();
    renderMessages(chat);
  }

  function renderMessages(chat) {
  chatMessages.innerHTML = "";
  if (!chat || chat.messages.length === 0) {
    const nameText = chat?.name ? `в "${chat.name}"` : "";
    chatMessages.innerHTML = `<p class="start-message">Чем займемся<br> ${nameText}?</p>`;
  } else {
    chat.messages.forEach(msg => {
      const div = document.createElement("div");
      div.className = `message ${msg.isUser ? "user-message" : "ai-message"}`;
      div.innerHTML = `<div>${msg.text}</div><div style="font-size:11px;opacity:0.6;margin-top:6px;">${msg.time}</div>`;
      chatMessages.appendChild(div);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
}

  function renderChatList() {
  chatList.innerHTML = "";
  chats.forEach(chat => {
    const chatItem = document.createElement("div");
    chatItem.className = "chat-item";
    chatItem.textContent = chat.name;
    chatItem.style.position = "relative";

    const renameBtn = document.createElement("button");
    renameBtn.textContent = "✏️";
    renameBtn.style.position = "absolute";
    renameBtn.style.right = "30px";
    renameBtn.style.top = "50%";
    renameBtn.style.transform = "translateY(-50%)";
    renameBtn.style.display = "none";
    renameBtn.style.border = "none";
    renameBtn.style.background = "transparent";
    renameBtn.style.cursor = "pointer";

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "🗑️";
    deleteBtn.style.position = "absolute";
    deleteBtn.style.right = "5px";
    deleteBtn.style.top = "50%";
    deleteBtn.style.transform = "translateY(-50%)";
    deleteBtn.style.display = "none";
    deleteBtn.style.border = "none";
    deleteBtn.style.background = "transparent";
    deleteBtn.style.cursor = "pointer";

    chatItem.addEventListener("mouseenter", () => {
      renameBtn.style.display = "inline";
      deleteBtn.style.display = "inline";
    });
    chatItem.addEventListener("mouseleave", () => {
      renameBtn.style.display = "none";
      deleteBtn.style.display = "none";
    });

    // для тач устройств показываем кнопки всегда
    chatItem.addEventListener("touchstart", () => {
      renameBtn.style.display = "inline";
      deleteBtn.style.display = "inline";
    });

    chatItem.addEventListener("click", () => {
      activeChatId = chat.id;
      saveChats();
      renderMessages(chat);
      if (window.innerWidth <= 1250) hideMenu(); // чтобы меню скрылось после выбора на телефоне
    });

    renameBtn.addEventListener("click", e => {
      e.stopPropagation();
      const newName = prompt("Новое название чата:", chat.name);
      if (!newName) return;
      chat.name = newName;
      saveChats();
      renderChatList();
    });

    deleteBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (!confirm(`Удалить чат "${chat.name}"?`)) return;

  if (activeChatId === chat.id) {
    activeChatId = null;
    chatMessages.innerHTML = `<p class="start-message">Привет! Что будем делать<br>сегодня? Создай новый чат!</p>`;
  }

  chats = chats.filter(c => c.id !== chat.id);
  saveChats();
  renderChatList();
});

    chatItem.appendChild(renameBtn);
    chatItem.appendChild(deleteBtn);
    chatList.appendChild(chatItem);
  });
}

function sendMessage() {
  let text = messageInput.value.trim();
  if (!text) return;

  // если нет активного чата — создаем автоматически
  if (!activeChatId) {
    const chatName = `Новый чат ${chats.length + 1}`;
    const id = Date.now().toString();
    const newChat = { id, name: chatName, messages: [] };
    chats.push(newChat);
    activeChatId = id;
    saveChats();
    renderChatList();
  }

  // теперь точно есть активный чат
  addMessage(text, true);
  messageInput.value = "";

  setTimeout(() => {
    const responses = ["Понял задачу! 🎯", "Уже делаю 💪", "Реализую через glassmorphism... ✨"];
    addMessage(responses[Math.floor(Math.random() * responses.length)]);
  }, 800);
};

  function createNewChat(name = null) {
    const chatName = name || prompt("Название нового чата:", `Новый чат ${chats.length + 1}`);
    if (!chatName) return;
    const id = Date.now().toString();
    const newChat = { id, name: chatName, messages: [] };
    chats.push(newChat);
    activeChatId = id;
    saveChats();
    renderChatList();
    renderMessages(newChat);
  }

  const exitChatButton = document.getElementById("exitChatButton");

function exitChat() {
  activeChatId = null;
  saveChats();
  chatMessages.innerHTML = `<p class="start-message">Привет! Что будем делать<br>сегодня? Создай новый чат!</p>`;
}

exitChatButton.addEventListener("click", exitChat);

  // --- инициализация ---
// --- инициализация ---
if (chats.length > 0) {
    // проверяем, есть ли активный чат
    let activeChat = chats.find(c => c.id === activeChatId);
    if (!activeChat) activeChat = chats[0], activeChatId = activeChat.id;
    renderChatList();
    renderMessages(activeChat);
}

  messageInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });
  sendButton.addEventListener("click", sendMessage);
  messageInput.focus();

  newChatButton.addEventListener("click", () => createNewChat());
});
</script>
</body>

</html>
